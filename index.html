<style>

* {

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: white;

  background:
    radial-gradient(
      circle at top,
      #6b4a35 0%,
      #3f2a20 45%,
      #1b110d 100%
    );

  overflow-x: hidden;
}

/* BACKGROUND STARS */

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background-image:
    radial-gradient(#ffffff 1px, transparent 1px),
    radial-gradient(#ffffff 1px, transparent 1px);

  background-size:
    55px 55px,
    90px 90px;

  background-position:
    10px 20px,
    30px 50px;

  opacity: 0.25;

  pointer-events: none;
}


/* HEADER */

.header {
  text-align: center;
  padding: 35px 15px 15px;
}

.title {
  font-size: 32px;
  font-weight: normal;
  margin: 0;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: 13px;
  opacity: 0.7;
  margin-top: 8px;
  line-height: 1.7;
}

.since {
  display: block;
  font-size: 11px;
  opacity: 0.8;
  margin-top: 2px;
  letter-spacing: 0.5px;
}


/* JAR */

.jar {
  width: min(94vw, 520px);

  margin: 25px auto 45px;

  padding: 30px 18px 38px;

  border: 2px solid rgba(255,255,255,0.18);

  border-radius:
    45px
    45px
    55px
    55px;

  background: rgba(255,255,255,0.06);

  box-shadow:
    inset 0 0 35px rgba(255,255,255,0.04),
    0 20px 60px rgba(0,0,0,0.35);
}


/* STARS */

.stars {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 14px 5px;
}

.star {
  border: none;

  background: none;

  color: #ffe9a6;

  font-size: 29px;

  padding: 4px;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    filter 0.2s ease;

  filter:
    drop-shadow(
      0 0 7px
      rgba(255,220,120,0.55)
    );
}

.star:hover {
  transform:
    scale(1.3)
    rotate(-8deg);

  filter:
    drop-shadow(
      0 0 14px
      rgba(255,235,150,0.95)
    );
}

.star:active {
  transform:
    scale(1.35)
    rotate(-8deg);
}


/* MESSAGE POPUP */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(4,3,10,0.82);

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 10;
}

.modal.show {
  display: flex;
}


/* MESSAGE CARD */

.message-card {
  width: min(90vw, 400px);

  max-height: 85vh;

  overflow-y: auto;

  background:
    linear-gradient(
      145deg,
      #fffaf0,
      #f2e2c8
    );

  color: #352840;

  border-radius: 25px;

  padding: 30px 24px 25px;

  text-align: center;

  box-shadow:
    0 20px 70px
    rgba(0,0,0,0.55);

  animation:
    pop 0.25s ease;
}

@keyframes pop {

  from {
    transform: scale(0.8);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}


/* BIG STAR */

.big-star {
  font-size: 48px;

  margin-bottom: 5px;
}


/* STAR NUMBER */

.star-number {
  font-family: Arial, sans-serif;

  font-size: 11px;

  opacity: 0.45;

  margin-bottom: 15px;
}


/* MESSAGE */

.message {
  font-size: 19px;

  line-height: 1.6;

  white-space: pre-wrap;

  min-height: 70px;
}


/* CLOSE BUTTON */

.close-button {

  border: none;

  background: #352840;

  color: white;

  border-radius: 999px;

  padding: 10px 22px;

  cursor: pointer;

.close-button:hover {

/* MOBILE */

  .title {

  .jar {

  .star {

  .message-card {

  .message {

  }

/* ========================================
   CREATE STARS AUTOMATICALLY
======================================== */

const starsContainer =
  document.getElementById("stars");

const modal =
  document.getElementById("modal");

const message =
  document.getElementById("message");

const starNumber =
  document.getElementById("starNumber");


for (
  let i = 0;
  i < messages.length;
  i++
) {

  const star =
    document.createElement("button");

  star.className =
    "star";

  star.innerHTML =
    "★";

  star.setAttribute(
    "aria-label",
    "Star " + (i + 1)
  );

  star.onclick =
    function() {
      openMessage(i);
    };

  starsContainer.appendChild(star);

}


/* ========================================
   OPEN MESSAGE
======================================== */

function openMessage(index) {

  starNumber.innerText =
    "STAR " + (index + 1);

  message.innerText =
    messages[index];

  modal.classList.add("show");

}


/* ========================================
   CLOSE MESSAGE
======================================== */

function closeMessage() {

  modal.classList.remove("show");

}


/* ========================================
   CLOSE WHEN CLICKING OUTSIDE
======================================== */

function closeOutside(event) {

  if (
    event.target === modal
  ) {

    closeMessage();

  }

}


/* ========================================
   CLOSE WITH ESC KEY
======================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeMessage();

    }

  }
);
